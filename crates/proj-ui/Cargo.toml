[package]
name = "proj-ui"
version = "0.1.0"
edition = "2024"
description = "GPUI launcher, search palette and window switcher for proj"

[dependencies]
proj-cli = { path = "../proj-cli" }
proj-core = { path = "../proj-core" }
proj-git = { path = "../proj-git" }
proj-projects = { path = "../proj-projects" }
async-channel = "2"
global-hotkey = "0.8.0"
gpui = "0.2.2"
# The pixel buffer type gpui images are made of.
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png", "webp"] }
percent-encoding = "2"
resvg = { version = "0.45.1", default-features = false }
serde_json = "1"
ureq = { version = "3.4.2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Console",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.25"
