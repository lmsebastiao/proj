<!-- proj's icon: a search glass with a prompt chevron. Used at 32 px and up;
     icon-small.svg is the bolder version for 16-24 px. Run scripts/make-icon after editing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2e34"/>
      <stop offset="1" stop-color="#17181b"/>
    </linearGradient>
  </defs>
  <rect x="18" y="18" width="220" height="220" rx="50" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>
  <circle cx="112" cy="112" r="50" fill="none" stroke="#74ade8" stroke-width="20"/>
  <path d="M150 150l42 42" stroke="#74ade8" stroke-width="26" stroke-linecap="round"/>
  <path d="M98 90l24 22-24 22" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
