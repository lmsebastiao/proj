# Pushing a tag like v0.2.0 builds the installer and publishes it as a GitHub
# Release. Installed copies of proj find it there and offer to update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build-installer.ps1 downloads portable NSIS here when it isn't installed.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\proj-build
          key: nsis-${{ hashFiles('scripts/build-installer.ps1') }}

      - name: Check the tag matches Cargo.toml
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
              throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: .\scripts\build-installer.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "proj-setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          gh release create $env:GITHUB_REF_NAME "dist\$name" dist\SHA256SUMS.txt `
              --title "proj $env:VERSION" --generate-notes
