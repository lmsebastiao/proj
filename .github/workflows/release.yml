# Run by hand (Actions > Release > Run workflow, or `gh workflow run release.yml`).
# Builds the installer for the version in Cargo.toml and publishes it as a GitHub
# Release, creating the vX.Y.Z tag on the commit it built. Installed copies of
# proj find the release there and offer to update.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release

# Two runs at once would race to create the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Fail before the long build if this version can't be released.
      - name: Check the branch and version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Releases are made from main, not $env:GITHUB_REF_NAME"
          }
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
              Select-Object -First 1).Matches.Groups[1].Value
          if (git ls-remote --tags origin "refs/tags/v$version") {
              throw "v$version is already tagged; bump version in Cargo.toml first"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build-installer.ps1 downloads portable NSIS here when it isn't installed.
      - uses: actions/cache@v6
        with:
          path: ~\AppData\Local\proj-build
          key: nsis-${{ hashFiles('scripts/build-installer.ps1') }}

      - run: .\scripts\build-installer.ps1

      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "proj-setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          # --target creates the tag on the commit that was built.
          gh release create "v$env:VERSION" "dist\$name" dist\SHA256SUMS.txt `
              --target $env:GITHUB_SHA --title "proj $env:VERSION" --generate-notes
