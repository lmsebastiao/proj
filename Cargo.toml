[workspace]
members = ["crates/proj", "crates/proj-cli", "crates/proj-core", "crates/proj-git", "crates/proj-projects", "crates/proj-ui"]
resolver = "3"
default-members = ["crates/proj"]

# The binary and its CLI/update code must report the same release version.
[workspace.package]
version = "1.0.23"

[workspace.lints.clippy]
all = "deny"

pedantic = { level = "deny", priority = -1 }

borrow_as_ptr = "deny"
elidable_lifetime_names = "deny"
explicit_iter_loop = "deny"
manual_assert = "deny"
manual_let_else = "deny"
redundant_clone = "deny"
ref_option = "deny"
semicolon_if_nothing_returned = "deny"
uninlined_format_args = "deny"
unnecessary_wraps = "deny"
unnested_or_patterns = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
