[package]
name = "proj"
version = "0.1.0"
edition = "2024"
description = "Always-running project launcher with a Raycast-style search dialog"

[dependencies]
async-channel = "2"
dirs = "7.0.0"
global-hotkey = "0.8.0"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
